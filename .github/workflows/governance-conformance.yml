name: Governance conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Acquire locked GOV-GEN framework
        run: |
          FRAMEWORK_ROOT="$(python3 scripts/acquire-framework.py)"
          echo "GOV_GEN_FRAMEWORK_ROOT=$FRAMEWORK_ROOT" >> "$GITHUB_ENV"

      - name: Validate GOV-GEN consumer conformance
        run: >
          python3 "$GOV_GEN_FRAMEWORK_ROOT/tools/validate_consumer.py"
          --consumer .
          --framework "$GOV_GEN_FRAMEWORK_ROOT"
          --lock framework-lock.json

      - name: Validate Dopis specifications
        run: |
          python3 scripts/validate_specification.py
          python3 scripts/test_validate_specification.py
