name: Governance conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GOV-GEN validator dependencies
        run: python -m pip install pyyaml jsonschema

      - name: Acquire locked GOV-GEN framework
        run: |
          FRAMEWORK_ROOT="$(python3 scripts/acquire-framework.py)"
          echo "GOV_GEN_FRAMEWORK_ROOT=$FRAMEWORK_ROOT" >> "$GITHUB_ENV"

      - name: Validate GOV-GEN consumer conformance
        run: >
          python "$GOV_GEN_FRAMEWORK_ROOT/tools/validate_consumer.py"
          --consumer .
          --framework "$GOV_GEN_FRAMEWORK_ROOT"
          --lock framework-lock.json

      - name: Validate Dopis specifications
        run: |
          python scripts/validate_specification.py
          python scripts/test_validate_specification.py
