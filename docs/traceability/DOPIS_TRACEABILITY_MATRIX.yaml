link_rules:
  - from_type: BUSINESS_SOURCE
    relation: DERIVES
    to_type: REQUIREMENT
    required: true
  - from_type: EPIC
    relation: COVERS
    to_type: REQUIREMENT
    required: true
  - from_type: VALIDATION_GATE
    relation: BLOCKS_OR_CALIBRATES
    to_type: REQUIREMENT
    required_when_status: BLOCKED_BY_VALIDATION
  - from_type: USE_CASE
    relation: REFINES
    to_type: REQUIREMENT
    required_in_phase: S3_USE_CASES
  - from_type: STORY
    relation: REALIZES
    to_type: REQUIREMENT
    required_in_phase: S5_BACKLOG
  - from_type: ACCEPTANCE_CRITERION
    relation: VALIDATES
    to_type: REQUIREMENT
    required_before_story_ready: true
  - from_type: ARCHITECTURE_DECISION
    relation: REALIZES
    to_type: REQUIREMENT
    required_when_material: true
  - from_type: TASK
    relation: REALIZES
    to_type: ACCEPTANCE_CRITERION
    required_before_task_ready: true
  - from_type: TEST
    relation: VERIFIES
    to_type: ACCEPTANCE_CRITERION
    required_before_done: true
  - from_type: RELEASE_EVIDENCE
    relation: PRODUCES_EVIDENCE_FOR
    to_type: TEST
    required_before_release: true

coverage_rules:
  requirement_requires_business_source: true
  requirement_requires_epic: true
  baselined_requirement_requires_verification_method: true
  blocked_requirement_requires_validation_gate: true
  use_case_requires_requirement: true
  story_requires_requirement: true
  task_requires_requirement: true
  task_requires_acceptance_criterion: true
  test_requires_acceptance_target: true
  superseded_node_requires_successor: true
  duplicate_business_rule_forbidden: true

orphan_checks:
  requirements_without_epic: []
  requirements_without_source: []
  blocked_requirements_without_gate: []
  stories_without_requirements: []
  tasks_without_requirements: []
  tasks_without_acceptance_criteria: []
  tests_without_acceptance_targets: []
  stale_superseded_links: []

